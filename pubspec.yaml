name: ios_app
description: iOS Remote Access App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  socket_io_client: ^2.0.3
  permission_handler: ^11.0.1
  geolocator: ^10.1.0
  camera: ^0.10.5+5
  record: ^5.0.4
  contacts_service: ^0.6.3
