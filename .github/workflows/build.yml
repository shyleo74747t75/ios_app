name: Build iOS
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2.12.0
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
      - name: Flutter pub get
        run: flutter pub get
      - name: Build iOS
        run: |
          cd ios
          xcodebuild -project Runner.xcodeproj -scheme Runner -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: ios/build/Build/Products/Release-iphoneos/Runner.app
